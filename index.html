            const parsed = JSON.parse(raw);
            const def = createDefaultData();
            return {
              ...def,
              ...parsed,
              event: { ...def.event, ...(parsed.event || {}) }
            };
          }
        } catch (e) { console.warn('Local load fallback:', e); }
        return createDefaultData();
      }

      function loadCloudConfig() {
        let embedded = { databaseURL: '', workspaceId: 'fajar-selviana-2026' };
        try {
          const el = document.getElementById('embedded-cloud-config');
          if (el && el.textContent.trim()) {
            embedded = { ...embedded, ...JSON.parse(el.textContent) };
          }
        } catch (e) {}
        try {
          const saved = localStorage.getItem(CLOUD_CFG_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              databaseURL: parsed.databaseURL || embedded.databaseURL || '',
              workspaceId: parsed.workspaceId || embedded.workspaceId || 'fajar-selviana-2026'
            };
          }
        } catch (e) {}
        return embedded;
      }

      function saveState(actionLabel, skipCloudPush) {
        state.updatedAt = Date.now();
        state.updatedBy = currentUser || 'Tamu Undangan';
        if (actionLabel) {
          state.activityLogs = state.activityLogs || [];
          state.activityLogs.unshift({
            id: 'log_' + Date.now(),
            user: state.updatedBy,
            action: actionLabel,
            time: Date.now()
          });
          if (state.activityLogs.length > 25) state.activityLogs = state.activityLogs.slice(0, 25);
        }
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
        if (!skipCloudPush && !isApplyingRemote && cloudConfig.databaseURL) {
          pushStateToCloud();
        }
        renderActiveView();
      }

      // ==================== CLOUD SYNC ENGINE (FIREBASE RTDB REST + SSE) ====================
      function normalizeDbUrl(url) {
        return (url || '').trim().replace(/\/+$/, '');
      }

      function getCloudEndpoint() {
        const base = normalizeDbUrl(cloudConfig.databaseURL);
        const ws = (cloudConfig.workspaceId || 'fajar-selviana-2026').replace(/[^a-zA-Z0-9_-]/g, '');
        if (!base) return '';
        return `${base}/wedding_workspaces/${ws}.json`;
      }

      function updateSyncBadge(connected, label) {
        cloudConnected = connected;
        const badge = document.getElementById('sync-status-badge');
        if (!badge) return;
        if (connected) {
          badge.className = 'badge bg-emerald-50 text-emerald-700 border border-emerald-200 cursor-pointer';
          badge.textContent = '● ' + (label || 'Live Cloud Sync (Real-Time)');
        } else {
          badge.className = 'badge bg-amber-50 text-amber-800 border border-amber-200 cursor-pointer';
          badge.textContent = '● ' + (label || 'Mode Lokal (Hubungkan Cloud)');
        }
      }

      async function pushStateToCloud() {
        const endpoint = getCloudEndpoint();
        if (!endpoint) return;
        try {
          const res = await fetch(endpoint, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(state)
          });
          if (res.ok) {
            updateSyncBadge(true, 'Live Cloud Sync (Real-Time)');
          } else {
            updateSyncBadge(false, 'Gagal Sync (Cek Rules Firebase)');
          }
        } catch (err) {
          updateSyncBadge(false, 'Offline — Tersimpan Lokal');
        }
      }

      function applyRemoteState(remoteData) {
        if (!remoteData || typeof remoteData !== 'object') return;
        if (remoteData.updatedAt && state.updatedAt && remoteData.updatedAt <= state.updatedAt) return;
        isApplyingRemote = true;
        try {
          const def = createDefaultData();
          state = {
            ...def,
            ...remoteData,
            event: { ...def.event, ...(remoteData.event || {}) }
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          renderActiveView();
          if (!document.getElementById('public-invitation-view').classList.contains('hidden')) {
            renderPublicInvitation();
          }
        } finally {
          isApplyingRemote = false;
        }
      }

      async function fetchCloudOnce() {
        const endpoint = getCloudEndpoint();
        if (!endpoint) return false;
        try {
          const res = await fetch(endpoint);
          if (!res.ok) {
            updateSyncBadge(false, 'Cek Rules / URL Firebase');
            return false;
          }
          const data = await res.json();
          if (data === null) {
            // Inisialisasi workspace di cloud pertama kali
            await pushStateToCloud();
          } else {
            applyRemoteState(data);
          }
          updateSyncBadge(true, 'Live Cloud Sync (Real-Time)');
          return true;
        } catch (e) {
          updateSyncBadge(false, 'Mode Lokal (Offline)');
          return false;
        }
      }

      function startCloudSync() {
        stopCloudSync();
        const endpoint = getCloudEndpoint();
        if (!endpoint) {
          updateSyncBadge(false, 'Mode Lokal (Hubungkan Cloud)');
          return;
        }
        fetchCloudOnce();

        // Firebase RTDB native Server-Sent Events
        try {
          cloudEventSource = new EventSource(endpoint);
          cloudEventSource.addEventListener('put', function (ev) {
            try {
              const payload = JSON.parse(ev.data);
              if (payload && payload.path === '/' && payload.data) {
                applyRemoteState(payload.data);
              } else if (payload && payload.path === '/' && payload.data === null) {
                pushStateToCloud();
              } else {
                fetchCloudOnce();
              }
              updateSyncBadge(true, 'Live Cloud Sync (Real-Time)');
            } catch (e) {}
          });
          cloudEventSource.addEventListener('patch', function () {
            fetchCloudOnce();
          });
          cloudEventSource.onerror = function () {
            // Fallback ke polling ringan jika SSE ditutup browser/jaringan
            if (cloudEventSource) {
              cloudEventSource.close();
              cloudEventSource = null;
            }
          };
        } catch (e) {}

        // Polling backup setiap 6 detik untuk menjamin sinkronisasi lintas jaringan
        cloudPollTimer = setInterval(fetchCloudOnce, 6000);
      }

      function stopCloudSync() {
        if (cloudEventSource) {
          cloudEventSource.close();
          cloudEventSource = null;
        }
        if (cloudPollTimer) {
          clearInterval(cloudPollTimer);
          cloudPollTimer = null;
        }
      }

      // Sinkronisasi antar-tab pada browser yang sama
      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY && e.newValue) {
          try {
            applyRemoteState(JSON.parse(e.newValue));
          } catch (err) {}
        }
      });

      function uid(prefix) {
        return prefix + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
      function rp(num) {
        return 'Rp ' + Number(num || 0).toLocaleString('id-ID');

      function formatDateID(dateStr) {
        if (!dateStr) return '-';
        const d = new Date(dateStr + 'T00:00:00');
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      }
      function formatShortDate(dateStr) {
        if (!dateStr) return '-';
        const d = new Date(dateStr + 'T00:00:00');
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
      }
      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.remove('hidden');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.add('hidden'), 3000);
      }
      function copyText(text, msg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(msg || 'Disalin ke clipboard!')).catch(() => fallbackCopy(text, msg));
        } else {
          fallbackCopy(text, msg);
        }
      }
      function fallbackCopy(text, msg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast(msg || 'Disalin ke clipboard!'); } catch (e) {}
        document.body.removeChild(ta);
      }

        if (diff <= 0) return { days: 0, hours: 0, mins: 0, secs: 0, passed: true };
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        return { days, hours, mins, secs, passed: false };
      }

      // ==================== 6. CALENDAR ====================
      function renderCalendar() {
        const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDay; i++) cells.push('');
        for (let d = 1; d <= daysInMonth; d++) cells.push(d);

        const sortedEvents = [...state.eventsCalendar].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

        document.getElementById('tab-calendar').innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div class="card-luxury p-5 lg:col-span-2">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-serif text-lg font-semibold">${monthNames[calMonth]} ${calYear}</h3>
                <div class="flex gap-2">
                  <button onclick="shiftCalMonth(-1)" class="btn-outline px-3 py-1 text-xs">◀</button>
                  <button onclick="shiftCalMonth(1)" class="btn-outline px-3 py-1 text-xs">▶</button>
                  <button onclick="openCalendarModal()" class="btn-gold text-xs">+ Agenda</button>
                </div>
              </div>
              <div class="grid grid-cols-7 gap-1.5 text-center text-xs font-semibold text-mocha mb-2">
                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
              </div>
              <div class="grid grid-cols-7 gap-1.5">
                ${cells.map(d => {
                  if (!d) return '<div class="h-14"></div>';
                  const iso = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                  const hasEv = state.eventsCalendar.some(ev => ev.date === iso);
                  const isSel = selectedCalDate === iso;
                  const isWed = state.event.weddingDate === iso;
                  return `
                    <button onclick="selectCalDay('${iso}')" class="h-14 rounded-xl border text-xs flex flex-col items-center justify-center relative ${isSel ? 'border-champagne bg-beige font-bold' : 'border-sand bg-white hover:bg-ivory'}">
                      <span>${d}</span>
                      ${isWed ? '<span class="text-[10px] text-champagneDark font-bold">♥ H</span>' : hasEv ? '<span class="w-1.5 h-1.5 rounded-full bg-champagne mt-1"></span>' : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="card-luxury p-5 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="font-serif text-lg font-semibold">Timeline Agenda</h3>
                <button onclick="openCalendarModal('${selectedCalDate}')" class="text-xs text-champagneDark font-semibold hover:underline">+ Di tanggal dipilih</button>
              </div>
              <div class="space-y-2 max-h-[420px] overflow-y-auto">
                ${sortedEvents.map(ev => `
                  <div class="p-3 rounded-xl border ${ev.date === selectedCalDate ? 'border-champagne bg-beige/60' : 'border-sand bg-ivory'}">
                    <div class="flex items-start justify-between gap-2">
                      <div class="text-xs font-semibold text-champagneDark">${formatShortDate(ev.date)} • ${esc(ev.time)}</div>
                      <button onclick="deleteCalEvent('${ev.id}')" class="text-xs text-red-500 hover:underline">Hapus</button>
                    </div>
                    <div class="font-medium text-sm text-espresso mt-0.5">${esc(ev.title)}</div>
                    <div class="text-xs text-mocha">${esc(ev.location)}</div>
                    ${ev.note ? `<div class="text-[11px] text-mocha/80 mt-1">${esc(ev.note)}</div>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      window.shiftCalMonth = function (delta) {
        calMonth += delta;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        else if (calMonth > 11) { calMonth = 0; calYear++; }
        renderCalendar();
      };
      window.selectCalDay = function (iso) {
        selectedCalDate = iso;
        renderCalendar();

        pubUrl.search = '?undangan=1';
        document.getElementById('tab-invitation').innerHTML = `
          <div class="card-luxury p-5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs font-semibold text-mocha">Tema Undangan:</span>
              <button onclick="setInviteTheme('champagne')" class="btn-outline text-xs ${state.event.inviteTheme === 'champagne' ? 'border-champagne bg-beige' : ''}">Champagne Ivory</button>
              <button onclick="setInviteTheme('espresso')" class="btn-outline text-xs ${state.event.inviteTheme === 'espresso' ? 'border-champagne bg-beige' : ''}">Royal Espresso Gold</button>
              <button onclick="setInviteTheme('floral')" class="btn-outline text-xs ${state.event.inviteTheme === 'floral' ? 'border-champagne bg-beige' : ''}">Soft Floral Beige</button>
            </div>
            <div class="flex gap-2">
              <button onclick="copyText('${esc(pubUrl.toString())}', 'Link undangan publik disalin!')" class="btn-gold text-xs">Salin Link Undangan Publik</button>
              <button onclick="enterPublicInviteMode()" class="btn-outline text-xs">Buka Mode Tamu</button>
            </div>
          </div>
          ${getInviteHtml('')}
        `;
      }

      function renderPublicInvitation() {
        const params = new URLSearchParams(window.location.search);
        const guestParam = params.get('tamu') || '';
        document.getElementById('public-invite-card').innerHTML = getInviteHtml(guestParam);
      }

      window.setInviteTheme = function (theme) {
        state.event.inviteTheme = theme;
        saveState(`Mengubah tema undangan menjadi ${theme}`);
      };

      window.submitPublicRsvp = function (e) {
        e.preventDefault();
        const name = document.getElementById('pub-rsvp-name').value.trim();
        const rsvp = document.getElementById('pub-rsvp-status').value;
        const pax = Number(document.getElementById('pub-rsvp-pax').value || 1);
        const wish = document.getElementById('pub-rsvp-wish').value.trim();
        const existing = state.guests.find(g => g.name.toLowerCase() === name.toLowerCase());
        if (existing) {
          existing.rsvp = rsvp;
          existing.pax = pax;
          if (wish) existing.wish = wish;
        } else {
          state.guests.unshift({
            id: uid('gst'),
            name,
            relation: 'Sahabat / Umum',
            pax,
            rsvp,
            phone: '',
            wish
          });
        }
        saveState(`RSVP masuk dari undangan: ${name} (${rsvp})`);
        showToast('Terima kasih! Konfirmasi & ucapan Anda telah tersimpan.');
        if (!document.getElementById('public-invitation-view').classList.contains('hidden')) {
          renderPublicInvitation();
        }
      };

      // ==================== SETTINGS, CLOUD SETUP, EXPORT/IMPORT ====================
      window.openEventSettingsModal = function () {
        const ev = state.event;
        openModal(`
          <h3 class="font-serif text-xl font-semibold mb-4">Pengaturan Acara &amp; PIN</h3>
          <form onsubmit="submitEventSettings(event)" class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-mocha">Pengantin Pria</label>
                <input id="s-groom" required class="input-lux mt-1" value="${esc(ev.groomName)}" />
              </div>
              <div>
                <label class="text-xs font-semibold text-mocha">Pengantin Wanita</label>
                <input id="s-bride" required class="input-lux mt-1" value="${esc(ev.brideName)}" />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="text-xs font-semibold text-mocha">Tanggal Acara</label>
                <input id="s-date" type="date" required class="input-lux mt-1" value="${esc(ev.weddingDate)}" />
              </div>
              <div>
                <label class="text-xs font-semibold text-mocha">Jam Akad</label>
                <input id="s-akad" required class="input-lux mt-1" value="${esc(ev.akadTime)}" />
              </div>
              <div>
                <label class="text-xs font-semibold text-mocha">Jam Resepsi</label>
                <input id="s-resepsi" required class="input-lux mt-1" value="${esc(ev.resepsiTime)}" />
              </div>
            </div>
            <div>
              <label class="text-xs font-semibold text-mocha">Nama Gedung / Venue</label>
              <input id="s-venue" required class="input-lux mt-1" value="${esc(ev.venueName)}" />
            </div>
            <div>
              <label class="text-xs font-semibold text-mocha">Alamat Lengkap Venue</label>
              <input id="s-addr" required class="input-lux mt-1" value="${esc(ev.venueAddress)}" />
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-mocha">Plafon Anggaran (Rp)</label>
                <input id="s-ceiling" type="number" min="0" required class="input-lux mt-1" value="${Number(ev.budgetCeiling || 0)}" />
              </div>
              <div>
                <label class="text-xs font-semibold text-mocha">PIN Akses Workspace</label>
                <input id="s-pin" required class="input-lux mt-1" value="${esc(ev.pinCode || '2026')}" />
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-3">
              <button type="button" onclick="closeModal()" class="btn-outline text-sm">Batal</button>
              <button type="submit" class="btn-gold text-sm">Simpan Pengaturan</button>
            </div>
          </form>
        `);
      };
      window.submitEventSettings = function (e) {
        e.preventDefault();
        state.event.groomName = document.getElementById('s-groom').value.trim();
        state.event.brideName = document.getElementById('s-bride').value.trim();
        state.event.weddingDate = document.getElementById('s-date').value;
        state.event.akadTime = document.getElementById('s-akad').value.trim();
        state.event.resepsiTime = document.getElementById('s-resepsi').value.trim();
        state.event.venueName = document.getElementById('s-venue').value.trim();
        state.event.venueAddress = document.getElementById('s-addr').value.trim();
        state.event.budgetCeiling = Number(document.getElementById('s-ceiling').value || 0);
        state.event.pinCode = document.getElementById('s-pin').value.trim() || '2026';
        saveState('Memperbarui pengaturan acara & PIN');
        closeModal();
        showToast('Pengaturan acara diperbarui!');
      };

      window.openCloudSetupModal = function () {
        openModal(`
          <h3 class="font-serif text-xl font-semibold mb-2">Cloud Sync (Firebase) &amp; GitHub Pages</h3>
          <p class="text-xs text-mocha mb-4">Hubungkan ke Firebase Realtime Database agar data Fajar &amp; Selviana tersinkron otomatis lintas jaringan/HP secara real-time.</p>
          <form onsubmit="submitCloudConfig(event)" class="space-y-3">
            <div>
              <label class="text-xs font-semibold text-mocha">Workspace ID</label>
              <input id="c-ws" required class="input-lux mt-1" value="${esc(cloudConfig.workspaceId || 'fajar-selviana-2026')}" />
            </div>
            <div>
              <label class="text-xs font-semibold text-mocha">Firebase Realtime Database URL (atau tempel firebaseConfig)</label>
              <textarea id="c-url" rows="3" placeholder="Contoh: https://wedding-fajar-selvi-default-rtdb.firebaseio.com" class="input-lux mt-1">${esc(cloudConfig.databaseURL || '')}</textarea>
              <p class="text-[11px] text-mocha mt-1">Bisa langsung tempel URL RTDB atau seluruh blok <code>firebaseConfig</code> dari Firebase Console.</p>
            </div>
            <div class="p-3 rounded-xl bg-ivory border border-sand text-xs text-mocha space-y-1">
              <div class="font-semibold text-espresso">Panduan Singkat GitHub Pages:</div>
              <div>1. Pastikan nama file di repository GitHub Anda adalah <strong>index.html</strong> (bukan nama lain).</div>
              <div>2. Aktifkan <strong>Settings → Pages → Branch: main / (root)</strong>.</div>
              <div>3. Klik tombol <strong>Download index.html</strong> di bawah untuk mendapatkan file yang sudah tertanam konfigurasi cloud Anda.</div>
            </div>
            <div class="flex flex-wrap justify-between gap-2 pt-2">
              <button type="button" onclick="downloadConfiguredHtml()" class="btn-outline text-xs">⬇ Download index.html (Siap GitHub)</button>
              <div class="flex gap-2">
                <button type="button" onclick="closeModal()" class="btn-outline text-sm">Tutup</button>
                <button type="submit" class="btn-gold text-sm">Simpan &amp; Hubungkan</button>
              </div>
            </div>
          </form>
        `);
      };

      function parseDatabaseUrlInput(raw) {
        const text = (raw || '').trim();
        if (!text) return '';
        const match = text.match(/https:\/\/[a-zA-Z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)/);
        if (match) return match[0];
        return text.replace(/\/+$/, '');
      }

      window.submitCloudConfig = async function (e) {
        e.preventDefault();
        const ws = document.getElementById('c-ws').value.trim() || 'fajar-selviana-2026';
        const dbUrl = parseDatabaseUrlInput(document.getElementById('c-url').value);
        cloudConfig = { workspaceId: ws, databaseURL: dbUrl };
        localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudConfig));
        closeModal();
        if (dbUrl) {
          showToast('Menghubungkan ke Firebase Cloud...');
          startCloudSync();
        } else {
          stopCloudSync();
          updateSyncBadge(false, 'Mode Lokal (Offline)');
          showToast('Beralih ke Mode Lokal.');
        }
      };

      window.downloadConfiguredHtml = function () {
        const ws = document.getElementById('c-ws').value.trim() || 'fajar-selviana-2026';
        const dbUrl = parseDatabaseUrlInput(document.getElementById('c-url').value);
        cloudConfig = { workspaceId: ws, databaseURL: dbUrl };
        localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudConfig));

        const docClone = document.documentElement.cloneNode(true);
        const cfgTag = docClone.querySelector('#embedded-cloud-config');
        if (cfgTag) {
          cfgTag.textContent = JSON.stringify({ databaseURL: dbUrl, workspaceId: ws }, null, 2);
        }
        // Reset tampilan clone agar bersih saat dibuka dari awal
        const lg = docClone.querySelector('#login-gate');
        const sh = docClone.querySelector('#app-shell');
        const pv = docClone.querySelector('#public-invitation-view');
        if (lg) lg.classList.remove('hidden');
        if (sh) sh.classList.add('hidden');
        if (pv) pv.classList.add('hidden');

        const finalHtml = '<!DOCTYPE html>\n' + docClone.outerHTML;
        const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('File index.html siap upload ke GitHub Pages berhasil diunduh!');
      };

      window.exportJSON = function () {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup-wedding-fajar-selviana-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('Backup JSON berhasil diunduh.');
      };

      window.importJSON = function (event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          try {
            const parsed = JSON.parse(ev.target.result);
            const def = createDefaultData();
            state = { ...def, ...parsed, event: { ...def.event, ...(parsed.event || {}) } };
            saveState('Mengimpor backup data JSON');
            showToast('Data JSON berhasil diimpor!');
          } catch (err) {
            showToast('File JSON tidak valid.');
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      };

      window.resetDefaultData = function () {
        if (!confirm('Kembalikan seluruh data ke contoh awal?')) return;
        state = createDefaultData();
        saveState('Mereset data ke default awal');
        showToast('Data dikembalikan ke default.');
      };

      // ==================== MODAL HELPERS ====================
      window.openModal = function (html) {
        document.getElementById('modal-box').innerHTML = html;
        document.getElementById('modal-root').classList.remove('hidden');
      };
      window.closeModal = function () {
        document.getElementById('modal-root').classList.add('hidden');
        document.getElementById('modal-box').innerHTML = '';
      };

      // ==================== BOOTSTRAP ====================
      function initApp() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('undangan') === '1') {
          enterPublicInviteMode();
          return;
        }
        try {
          const savedSession = localStorage.getItem(SESSION_KEY);
          if (savedSession) {
            const s = JSON.parse(savedSession);
            if (s && s.user && String(s.pin) === String(state.event.pinCode || '2026')) {
              currentUser = s.user;
              enterAppShell();
              return;
            }
          }
        } catch (e) {}
        document.getElementById('login-gate').classList.remove('hidden');
        startCloudSync();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
